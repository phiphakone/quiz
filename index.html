<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cau hoi on tap</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--card:#151b2e;--text:#eef2ff;--muted:#9aa6c2;--accent:#7c6cf0;--green:#2dd4a8;--red:#f07178;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;background:radial-gradient(1200px 600px at 10% -10%,rgba(124,108,240,.25),transparent),var(--bg);color:var(--text);min-height:100vh;padding:24px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:1.7rem;margin:8px 0 6px}
.sub{color:var(--muted);margin-bottom:22px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.qnum{color:var(--accent);font-weight:700;font-size:.85rem;letter-spacing:.04em;margin-bottom:8px}
.qtext{font-size:1.15rem;line-height:1.65;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#101628;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit;line-height:1.5}
.opt:hover{border-color:var(--accent)}
.opt .k{min-width:28px;height:28px;border-radius:8px;background:rgba(124,108,240,.2);color:#cfc6ff;display:flex;align-items:center;justify-content:center;font-weight:700}
.opt.ok{border-color:var(--green);background:rgba(45,212,168,.12)}
.opt.bad{border-color:var(--red);background:rgba(240,113,120,.12)}
.explain{margin-top:16px;padding:14px 16px;border-radius:12px;background:#101628;border-left:4px solid var(--accent);color:var(--muted);line-height:1.7;display:none}
.explain.show{display:block}
.explain b{color:var(--text)}
.bar{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
button.nav{background:var(--accent);border:0;color:#fff;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.nav:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.score{margin-top:10px;color:var(--muted)}
.links{margin-top:18px;color:var(--muted);font-size:.9rem}
.links a{color:#cfc6ff}
</style>
</head>
<body>
<div class="wrap">
<p class="qnum">ON TAP</p>
<h1>Cau hoi trac nghiem</h1>
<p class="sub">Bam A B C D. Sau khi chon se hien dap an va giai thich ngay cau do.</p>
<div class="card">
<div class="qnum" id="num"></div>
<div class="qtext" id="q"></div>
<div class="opts" id="opts"></div>
<div class="explain" id="ex"></div>
<div class="bar">
<button class="nav ghost" id="prev" type="button">Cau truoc</button>
<button class="nav" id="next" type="button">Cau tiep</button>
</div>
<div class="score" id="score"></div>
</div>
<p class="links">Bai giang:
<a href="https://phiphakone.github.io/1/">Insertion</a> .
<a href="https://phiphakone.github.io/2/">Interchange</a> .
<a href="https://phiphakone.github.io/3/">Selection</a> .
<a href="https://phiphakone.github.io/4/">Bubble</a>
</p>
</div>
<script>
const Q=[
{q:"Insertion Sort giong viec nao nhat?",a:["Chon nguoi thap nhat dua len dau hang","Sap bai tren tay, chen la bai vao dung cho","Doi cho ngay moi khi thay hai so dung sai","Day so lon ve cuoi nhu bot khi"],c:1,e:"Insertion Sort giong sap bai: lay key roi chen vao day da sap."},
{q:"Selection Sort doi cho toi da bao nhieu lan?",a:["n x n lan","n / 2 lan","n - 1 lan","Chi 1 lan"],c:2,e:"Moi vong chi doi 1 lan. Co n - 1 vong nen toi da n - 1 lan doi cho."},
{q:"Khac nhau chinh giua Interchange Sort va Selection Sort?",a:["Interchange doi ngay khi sai; Selection tim min roi moi doi mot lan","Interchange Sort nhanh hon O(n)","Selection Sort khong can so sanh","Ca hai deu dung som khi mang da sap"],c:0,e:"Interchange doi ngay khi a[i] > a[j]. Selection tim min xong moi doi 1 lan."},
{q:"Co swapped trong Bubble Sort dung de lam gi?",a:["Dem so phan tu","Luu gia tri lon nhat","Neu mot vong khong doi cho thi dung som","Doi cho hai phan tu"],c:2,e:"Dat swapped = false o dau vong. Neu het vong van false thi mang da sap, dung break."},
{q:"O(n^2) nghia la gi?",a:["Thoi gian tang gan dung bang so phan tu n","So buoc khoang n nhan n, cham khi n lon","Thuat toan luon sai","Chi dung cho mang da sap"],c:1,e:"Chu O doc o. O(n^2) = so buoc xap xi n nhan n. Vi du n = 100 khoang 10.000 buoc."},
{q:"Truong hop tot nhat cua Insertion Sort va Bubble Sort (co toi uu) la gi?",a:["O(n^2)","O(n log n)","O(1)","O(n)"],c:3,e:"Mang da sap: Insertion khong chay while; Bubble dung nho swapped. Dat O(n)."},
{q:"Thuat toan nao on dinh (stable)?",a:["Selection va Interchange","Insertion va Bubble","Chi Selection","Khong thuat toan nao"],c:1,e:"On dinh = giu thu tu cac phan tu bang nhau. Insertion va Bubble on dinh."},
{q:"Mang nao bat buoc phai da sap truoc khi tim?",a:["Tim kiem tuan tu","Bubble Sort","Tim kiem nhi phan","Interchange Sort"],c:2,e:"Tim nhi phan cat nua mang nen mang phai tang dan san. Tim tuan tu khong can sap."},
{q:"Trong tim kiem nhi phan, neu x > a[m] thi lam gi?",a:["R = m - 1, bo nua phai","L = m + 1, bo nua trai, tim ben phai","return -1 ngay","i = i + 1"],c:1,e:"x lon hon phan tu giua nghia la x nam ben phai, nen gan L = m + 1."},
{q:"Tim kiem tuan tu tra ve -1 khi nao?",a:["Khi tim thay x o dau mang","Khi x == a[i]","Khi da duyet het mang ma khong thay x","Khi mang da sap"],c:2,e:"Duyet tu i = 0 den het. Khong thay thi return -1."},
{q:"Bien temp trong C++ dung de lam gi?",a:["Dem so vong lap","Luu tam mot gia tri de doi cho hai phan tu","Kiem tra mang da sap chua","Tinh vi tri giua"],c:1,e:"Doi cho: temp = a[i]; a[i] = a[j]; a[j] = temp;"},
{q:"Nen dung thuat toan nao khi du lieu rat lon?",a:["Bubble Sort","Selection Sort","Interchange Sort","Khong nen dung 4 thuat toan O(n^2) nay"],c:3,e:"Ca 4 thuat toan deu O(n^2) khi n lon. Dung de hoc. Du lieu lon can thuat toan nhanh hon."}
];
let i=0,picked=Array(Q.length).fill(null),score=0;
const num=document.getElementById('num'),q=document.getElementById('q'),opts=document.getElementById('opts');
const ex=document.getElementById('ex'),prev=document.getElementById('prev'),next=document.getElementById('next'),sc=document.getElementById('score');
function render(){
 const t=Q[i];
 num.textContent='CAU '+(i+1)+' / '+Q.length;
 q.textContent=t.q;
 opts.innerHTML='';
 t.a.forEach((txt,k)=>{
  const b=document.createElement('button');
  b.className='opt'; b.type='button';
  b.innerHTML='<span class="k">'+'ABCD'[k]+'</span><span>'+txt+'</span>';
  if(picked[i]!==null){
    b.disabled=true;
    if(k===t.c) b.classList.add('ok');
    if(k===picked[i]&&k!==t.c) b.classList.add('bad');
  } else b.onclick=()=>choose(k);
  opts.appendChild(b);
 });
 if(picked[i]!==null){
  const ok=picked[i]===t.c;
  ex.className='explain show';
  ex.innerHTML='<b>'+(ok?'Dung.':'Sai.')+' Dap an: '+'ABCD'[t.c]+'</b><br>'+t.e;
 } else { ex.className='explain'; ex.textContent=''; }
 prev.disabled=i===0;
 next.textContent=i===Q.length-1?'Xem diem':'Cau tiep';
 const done=picked.filter(x=>x!==null).length;
 sc.textContent=done?('Da tra loi '+done+'/'+Q.length+' . Dung '+score+' cau'):'Chua chon dap an';
}
function choose(k){ if(picked[i]!==null) return; picked[i]=k; if(k===Q[i].c) score++; render(); }
prev.onclick=()=>{ if(i>0){i--;render();} };
next.onclick=()=>{ if(i<Q.length-1){i++;render();} else { q.textContent='Ban dung '+score+' / '+Q.length+' cau.'; opts.innerHTML=''; ex.className='explain show'; ex.innerHTML='<b>Het bai.</b> Bam Cau truoc de xem lai loi giai.'; next.disabled=true; sc.textContent='Diem: '+score+' / '+Q.length; } };
render();
</script>
</body></html>
